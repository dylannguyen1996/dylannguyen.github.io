<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate Landing Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header class="text-center my-5">
        <h1 class="display-4">Welcome to Dream Homes</h1>
        <p class="lead">Find your perfect property with us</p>
    </header>

    <section class="container my-5">
        <div class="row">
            <div class="col-md-6" >
                <img src="img/image 2.png" class="img-fluid" alt="Property">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <h2>Your Ideal Home Awaits</h2>
                <p>Browse through our extensive listings of apartments, houses and commercial spaces.</p>
                <button class="btn btn-primary w-50">Contact Us</button>
            </div>
        </div>
    </section>

    <section class="bg-light py-5">
        <div class="container text-center">
            <h2>Why Choose Us</h2>
            <div class="row mt-4">
                <div class="col-md-4">
                    <i class="fa-solid fa-building fa-2x mb-2"></i>
                    <p>Wide range of properties</p>
                </div>
                <div class="col-md-4">
                    <i class="fa-solid fa-dollar-sign fa-2x mb-2"></i>
                    <p>Competitive pricing</p>
                </div>
                <div class="col-md-4">
                    <i class="fa-solid fa-user-tie fa-2x mb-2"></i>
                    <p>Professional agents</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="text-center my-5">
        <p>&copy; 2023 Dream Homes</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
</body>
</html>
